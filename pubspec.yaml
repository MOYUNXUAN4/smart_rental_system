name: smart_rental_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase 核心依赖
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  flutter_stripe: ^12.1.1
  http: ^1.6.0
  cloud_functions: ^6.0.4

  # 🖼️ 图片与文件处理
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  flutter_image_compress: ^2.2.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1

  # 🌍 国际化与工具
  intl: ^0.18.1
  path_provider: ^2.1.5

  # 📄 PDF 生成 + 打印 + 电子签名
  pdf: ^3.11.0
  printing: ^5.11.0
  signature: ^6.3.0
  open_file: ^3.5.10
  flutter_pdfview: ^1.3.2

  # 💠 UI基础图标
  cupertino_icons: ^1.0.8

  # 💠 Google Map
  google_maps_flutter: ^2.4.6

  # 💠 url launcher
  url_launcher: ^6.3.2
  panorama_viewer: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/my_logo.png
    - assets/images/mainPageBackGround.png
    - assets/images/fonts/NotoSansSC-Regular.ttf
    - assets/images/fonts/NotoSansSC-Bold.ttf   # ← ⭐ 新增
    - assets/images/fonts/NotoSans-Regular.ttf

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/images/fonts/NotoSans-Regular.ttf

    - family: NotoSansSC             # ← ⭐ 中文字体
      fonts:
        - asset: assets/images/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/images/fonts/NotoSansSC-Bold.ttf
          weight: 700
